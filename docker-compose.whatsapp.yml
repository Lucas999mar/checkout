version: '3.8'

services:
  # ==========================================
  # Evolution API v2 (Recomendado)
  # Porta: 8080 | Global Key: checkout2026secretkey
  # ==========================================
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: evolution-checkout
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR,WARN,INFO
      - AUTHENTICATION_API_KEY=checkout2026secretkey
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

  # ==========================================
  # WAHA (WhatsApp HTTP API - Alternativa Leve)
  # Porta: 3000 | Dashboard / REST
  # ==========================================
  waha:
    image: devlikeapro/waha:latest
    container_name: waha-checkout
    restart: always
    ports:
      - "3000:3000"
    environment:
      - WAHA_ZIP_LOGS=false
      - WAHA_PRINT_QR=false
    volumes:
      - waha_sessions:/app/.sessions

volumes:
  evolution_instances:
  evolution_store:
  waha_sessions:
